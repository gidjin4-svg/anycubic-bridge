<title>Druckbett-Monitor</title>
<style>
  :root {
    --paper: #eef1f4;
    --surface: #ffffff;
    --surface-2: #e4e9ee;
    --ink: #1a2430;
    --ink-dim: #52626f;
    --line: #c7d0da;
    --accent: #c9612e;
    --accent-ink: #fff9f5;
    --good: #3f8557;
    --good-bg: #e3efe6;
    --warn: #b8562c;
    --warn-bg: #f6e8de;
    --mono-tint: #e9edf1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #10161d;
      --surface: #171f28;
      --surface-2: #1e2731;
      --ink: #dbe4ec;
      --ink-dim: #8697a5;
      --line: #2a3644;
      --accent: #e07b3f;
      --accent-ink: #1a0f08;
      --good: #5aa876;
      --good-bg: #16261d;
      --warn: #d97b4f;
      --warn-bg: #2a1c14;
      --mono-tint: #1c242e;
    }
  }
  :root[data-theme="dark"] {
    --paper: #10161d;
    --surface: #171f28;
    --surface-2: #1e2731;
    --ink: #dbe4ec;
    --ink-dim: #8697a5;
    --line: #2a3644;
    --accent: #e07b3f;
    --accent-ink: #1a0f08;
    --good: #5aa876;
    --good-bg: #16261d;
    --warn: #d97b4f;
    --warn-bg: #2a1c14;
    --mono-tint: #1c242e;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  /* Muss sein: eigene display-Regeln (z. B. flex auf der Chat-Karte) wuerden
     das hidden-Attribut sonst uebersteuern. Als Artifact bringt der Rahmen
     diese Regel schon mit, die lokale Datei nicht. */
  [hidden] { display: none !important; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, Segoe UI, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 24px 24px;
    background-attachment: fixed;
    opacity: 0.999;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: var(--paper);
    opacity: 0.94;
    z-index: -1;
  }

  h1, h2, h3 { font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif; text-wrap: balance; margin: 0; }

  .frame {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 100vh;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--ink);
  }
  header.top .brand {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  header.top h1 {
    font-size: 20px;
    font-weight: 600;
  }
  .status-dot {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    color: var(--ink-dim);
  }
  .status-dot i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ink-dim);
    display: inline-block;
  }
  .status-dot.live i { background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); }
  .status-dot.off i { background: var(--warn); }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 14px;
  }
  .card > h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--ink-dim);
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .card > h2 time {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    text-transform: none;
    letter-spacing: 0;
    color: var(--ink-dim);
  }

  /* Job-Kopf: Vorschau + Identitaet, wie in Mainsail/OctoPrint */
  .job-head {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .job-preview {
    width: 88px;
    height: 88px;
    flex: 0 0 88px;
    background: var(--mono-tint);
    border: 1px solid var(--line);
    border-radius: 2px;
    display: block;
    object-fit: contain;
  }
  .job-preview.missing {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 9.5px;
    color: var(--ink-dim);
    text-align: center;
    padding: 6px;
  }
  .job-id { min-width: 0; flex: 1; }
  .job-name {
    font-family: "IBM Plex Sans Condensed", sans-serif;
    font-size: 17px;
    font-weight: 600;
    line-height: 1.2;
    overflow-wrap: anywhere;
  }
  .job-machine {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 2px;
    overflow-wrap: anywhere;
  }
  .job-dims {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
    margin-top: 4px;
  }
  .job-flag {
    display: inline-block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    padding: 2px 6px;
    border-radius: 2px;
    margin-top: 6px;
  }
  .job-flag.warn { background: var(--warn-bg); color: var(--warn); }
  .job-flag.good { background: var(--good-bg); color: var(--good); }

  /* Job-Zahlen: die drei, auf die es bei einem Druckauftrag ankommt */
  .job-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 12px;
  }
  .job-stat { background: var(--surface); padding: 9px 6px; text-align: center; }
  .job-stat .v {
    font-family: "IBM Plex Mono", monospace;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .job-stat .v.pending { color: var(--ink-dim); font-weight: 400; }
  .job-stat .l {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    margin-top: 3px;
  }
  .stats-note {
    font-size: 10.5px;
    color: var(--ink-dim);
    margin-top: 5px;
    text-align: right;
  }

  .action-strip {
    margin-top: 14px;
    padding-top: 11px;
    border-top: 1px solid var(--line);
  }
  .action-what {
    font-size: 13px;
    font-weight: 600;
  }
  .action-trigger {
    font-size: 11.5px;
    color: var(--ink-dim);
    margin-top: 2px;
    margin-bottom: 10px;
  }

  .change-list { display: flex; flex-direction: column; gap: 9px; }
  .change {
    border-left: 2px solid var(--accent);
    padding-left: 9px;
  }
  .change-head {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
  }
  .change-head .k { color: var(--ink-dim); }
  .change-head .v { font-weight: 600; text-align: right; }
  .change-why {
    font-size: 11.5px;
    color: var(--ink-dim);
    line-height: 1.35;
    margin-top: 1px;
  }
  .change-empty { font-size: 12.5px; color: var(--ink-dim); }

  .slice-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 12px;
  }
  .slice-cell { background: var(--surface); padding: 8px 6px; text-align: center; }
  .slice-cell .v {
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .slice-cell .l {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    margin-top: 2px;
  }
  .slice-src {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    color: var(--ink-dim);
    text-align: right;
    margin-top: 4px;
  }

  /* skeleton */
  .skel { position: relative; overflow: hidden; background: var(--surface-2); border-radius: 2px; }
  .skel::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
    animation: shimmer 1.4s infinite;
  }
  @media (prefers-reduced-motion: reduce) { .skel::after { animation: none; } }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .skel-line { height: 12px; margin-bottom: 8px; width: 70%; }
  .skel-line.w2 { width: 45%; }
  .skel-line.w3 { width: 90%; }

  .empty-state {
    font-size: 12.5px;
    color: var(--ink-dim);
    text-align: center;
    padding: 18px 8px;
  }

  /* chat */
  .chat-card { flex: 1; display: flex; flex-direction: column; min-height: 320px; }
  .chat-log {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    padding-right: 2px;
    margin-bottom: 10px;
    min-height: 140px;
  }
  .bubble {
    max-width: 88%;
    padding: 8px 10px;
    border-radius: 3px;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--accent);
    color: var(--accent-ink);
    border-bottom-right-radius: 0;
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--surface-2);
    color: var(--ink);
    border-bottom-left-radius: 0;
  }
  .bubble.assistant.thinking { color: var(--ink-dim); font-style: italic; }
  .bubble.error { background: var(--warn-bg); color: var(--warn); }

  .chat-input-row {
    display: flex;
    gap: 8px;
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }
  .chat-input-row textarea {
    flex: 1;
    resize: none;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--mono-tint);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 8px 9px;
    height: 40px;
    line-height: 1.3;
  }
  .chat-input-row textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .chat-input-row button {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 13px;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 3px;
    padding: 0 16px;
    cursor: pointer;
  }
  .chat-input-row button:disabled {
    background: var(--surface-2);
    color: var(--ink-dim);
    cursor: default;
  }
  .chat-input-row textarea:disabled { background: var(--surface-2); color: var(--ink-dim); }
  .chat-input-row button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .chat-hint {
    font-size: 11px;
    color: var(--ink-dim);
    text-align: center;
    padding-top: 2px;
  }
  .local-chat-note {
    margin: 0;
    font-size: 11.5px;
    color: var(--ink-dim);
    text-align: center;
  }
  .chat-link { color: var(--accent); font-weight: 600; }
  .chat-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  footer.foot {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    color: var(--ink-dim);
    text-align: center;
    letter-spacing: 0.04em;
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<div class="frame">
  <header class="top">
    <div>
      <div class="brand">ANYCUBIC BRIDGE</div>
      <h1>Druckbett-Monitor</h1>
    </div>
    <span class="status-dot off" id="liveDot"><i></i><span id="liveLabel">verbinde…</span></span>
  </header>

  <section class="card" id="modelCard">
    <h2>Druckauftrag <time id="updatedAt"></time></h2>
    <div id="modelBody">
      <div class="job-head">
        <div class="skel job-preview"></div>
        <div class="job-id">
          <div class="skel skel-line w3" style="height:16px"></div>
          <div class="skel skel-line w2"></div>
          <div class="skel skel-line"></div>
        </div>
      </div>
    </div>
  </section>

  <p class="local-chat-note" id="localChatNote" hidden></p>

  <section class="card chat-card" id="chatCard">
    <h2>Chat</h2>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-row">
      <textarea id="chatInput" placeholder="Frag etwas zum aktuellen Modell oder Profil…" maxlength="2000"></textarea>
      <button id="sendBtn">Senden</button>
    </div>
    <div class="chat-hint" id="chatHint">Verbinde mit Claude…</div>
  </section>

  <footer class="foot" id="foot">schreibt nichts an Anycubic Slicer Next</footer>
</div>

<script>
(function () {
  'use strict';

  var state = {
    data: null,
    dbReady: false,
    sampleApi: null,
    turns: [],
    sending: false
  };

  var els = {
    liveDot: document.getElementById('liveDot'),
    liveLabel: document.getElementById('liveLabel'),
    modelBody: document.getElementById('modelBody'),
    updatedAt: document.getElementById('updatedAt'),
    chatCard: document.getElementById('chatCard'),
    localChatNote: document.getElementById('localChatNote'),
    chatLog: document.getElementById('chatLog'),
    chatInput: document.getElementById('chatInput'),
    sendBtn: document.getElementById('sendBtn'),
    chatHint: document.getElementById('chatHint')
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtTime(iso) {
    if (!iso) return '';
    try {
      var d = new Date(iso);
      return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  }

  var KEY_LABELS = {
    brim_type: 'Brim', enable_support: 'Support', support_threshold_angle: 'Ueberhang-Winkel',
    sparse_infill_density: 'Infill', layer_height: 'Schichthoehe'
  };

  function renderModel() {
    var d = state.data;
    if (!d) {
      els.modelBody.innerHTML = '<div class="empty-state">Noch keine Daten.<br>Laeuft der Watcher?</div>';
      els.updatedAt.textContent = '';
      return;
    }
    // Nichts auf dem Bett: dann steht hier auch nichts. Frueher wurde
    // ersatzweise die neueste Datei von der Platte gezeigt - das klebte dann
    // fest, auch wenn im Slicer laengst was anderes offen war.
    if (d.empty) {
      els.modelBody.innerHTML =
        '<div class="empty-state">Nichts auf dem Druckbett.<br>' +
        'Lade ein Modell in Anycubic Slicer Next &mdash; es erscheint hier von selbst.</div>';
      els.updatedAt.textContent = fmtTime(d.updatedAt);
      return;
    }
    var g = d.geometry || {};
    var act = d.lastAction || null;
    var s = d.slice || null;

    var preview = d.preview
      ? '<img class="job-preview" src="' + esc(d.preview) + '" alt="Vorschau des Modells">'
      : '<div class="job-preview missing">keine<br>Vorschau</div>';

    var flag = g.hasOverhang
      ? '<span class="job-flag warn">Ueberhang bis ' + esc(g.worstOverhangDeg) + '&deg;</span>'
      : '<span class="job-flag good">kein kritischer Ueberhang</span>';

    var dims = (g.widthMm != null)
      ? esc(g.widthMm) + '&times;' + esc(g.depthMm) + '&times;' + esc(g.heightMm) + ' mm &middot; ' + esc(g.volumeCm3) + ' cm&sup3;'
      : '';

    var head =
      '<div class="job-head">' + preview +
        '<div class="job-id">' +
          '<div class="job-name">' + esc(d.model || 'Unbenanntes Modell') + '</div>' +
          '<div class="job-machine">' + esc(d.machine || '') + '</div>' +
          (dims ? '<div class="job-dims">' + dims + '</div>' : '') +
          flag +
        '</div>' +
      '</div>';

    // Die drei Zahlen, die ein echter Druckauftrag hat. Dauer und Filament
    // entstehen erst beim Slicen - bis dahin ehrlich leer statt geraten.
    function stat(value, label, pending) {
      return '<div class="job-stat"><div class="v' + (pending ? ' pending' : '') + '">' + value +
             '</div><div class="l">' + label + '</div></div>';
    }
    var layers = (g.layerCount != null) ? esc(g.layerCount) : '&mdash;';
    var statsBlock =
      '<div class="job-stats">' +
        stat(s ? esc(s.duration) : '&mdash;', 'Druckdauer', !s) +
        stat(s ? esc(s.filamentGram) + '&nbsp;g' : '&mdash;', 'Filament', !s) +
        stat(layers, 'Schichten' + (g.layerHeightMm ? ' &agrave; ' + esc(g.layerHeightMm) + '&nbsp;mm' : ''), g.layerCount == null) +
      '</div>' +
      (s
        ? '<div class="stats-note">' + esc(s.filamentMeter) + '&nbsp;m' +
          (s.costEuro != null ? ' &middot; ' + esc(String(s.costEuro).replace('.', ',')) + '&nbsp;&euro; Material' : '') +
          ' &middot; aus ' + esc(s.source) + '</div>'
        : '<div class="stats-note">Dauer und Filament stehen erst nach dem Slicen fest</div>');

    // Was zuletzt passiert ist, mit den geaenderten Werten und ihrem Grund.
    var changes = d.changes || [];
    var changeRows = '';
    changes.forEach(function (c) {
      changeRows +=
        '<div class="change">' +
          '<div class="change-head"><span class="k">' + esc(KEY_LABELS[c.key] || c.key) + '</span>' +
          '<span class="v">' + esc(c.value) + '</span></div>' +
          (c.why ? '<div class="change-why">' + esc(c.why) + '</div>' : '') +
        '</div>';
    });
    var changeBlock = changeRows
      ? '<div class="change-list">' + changeRows + '</div>'
      : '<div class="change-empty">Keine Werte geaendert.</div>';

    var actionStrip =
      '<div class="action-strip">' +
        '<div class="action-what">' + (act ? esc(act.what) : 'Empfohlene Einstellungen') + '</div>' +
        (act && act.trigger ? '<div class="action-trigger">ausgeloest durch: ' + esc(act.trigger) + '</div>' : '') +
        changeBlock +
      '</div>';

    els.modelBody.innerHTML = head + statsBlock + actionStrip;
    els.updatedAt.textContent = fmtTime((act && act.at) || d.updatedAt);
  }

  function setLive(ok, label) {
    els.liveDot.className = 'status-dot ' + (ok ? 'live' : 'off');
    els.liveLabel.textContent = label;
  }

  function setFooter(source) {
    var foot = document.getElementById('foot');
    if (foot) { foot.textContent = source + ' · schreibt nichts an Anycubic Slicer Next'; }
  }

  function bubble(role, text, extraClass) {
    var div = document.createElement('div');
    div.className = 'bubble ' + role + (extraClass ? ' ' + extraClass : '');
    div.textContent = text;
    return div;
  }

  function renderChatLog() {
    els.chatLog.innerHTML = '';
    state.turns.forEach(function (t, i) {
      var isLastAssistantEmpty = t.role === 'assistant' && t.content === '' && i === state.turns.length - 1;
      var b = bubble(t.role, isLastAssistantEmpty ? 'Denkt nach…' : t.content, isLastAssistantEmpty ? 'thinking' : (t.error ? 'error' : ''));
      els.chatLog.appendChild(b);
    });
    els.chatLog.scrollTop = els.chatLog.scrollHeight;
  }

  var firstDataRendered = false;

  function seedGreeting() {
    var d = state.data;
    var greeting;
    if (d && d.empty) {
      greeting = 'Gerade liegt nichts auf dem Bett. Lade ein Modell in Anycubic Slicer Next, dann kann ich dir dazu was sagen.';
    } else if (d) {
      greeting = (d.lastAction ? 'Zuletzt: ' + d.lastAction.what + '. ' : '')
        + 'Auf dem Bett liegt "' + d.model + '". Frag mich, warum die Werte so gesetzt sind — oder was du sonst wissen willst.';
    } else {
      greeting = 'Noch keine Bridge-Analyse da. Lass "anycubic-bridge.ps1 recommend" einmal laufen, dann sag mir Bescheid.';
    }

    if (!firstDataRendered) {
      // Erster echter Ladevorgang: Begruessung als einzige Nachricht setzen.
      state.turns = [{ role: 'assistant', content: greeting }];
    } else if (d && state.turns.length > 0) {
      // Neue Bridge-Daten waehrend eines laufenden Chats: Verlauf NICHT loeschen,
      // nur kurz auf die Aktualisierung hinweisen.
      state.turns.push({ role: 'assistant', content: 'Neue Bridge-Analyse: ' + d.model + ' (' + d.machine + ').' });
    }
    firstDataRendered = true;
    renderChatLog();
  }

  var ERROR_COPY = {
    not_granted: 'Claude-Zugriff fuer dieses Fenster abgelehnt.',
    rate_limited: 'Gerade zu viele Anfragen — kurz warten und nochmal versuchen.',
    session_expired: 'Bitte neu anmelden.',
    refused: 'Claude hat diese Anfrage abgelehnt.',
    empty_completion: 'Keine Antwort erhalten — anders formulieren?',
    cancelled: 'Abgebrochen.'
  };

  function copyForError(code) {
    return ERROR_COPY[code] || 'Antwort fehlgeschlagen (' + code + ').';
  }

  function buildInstructionsTurn() {
    var d = state.data;
    var lines = [
      'Du bist die Chat-Ansicht der Anycubic Bridge, einem Begleitfenster neben Anycubic Slicer Next.',
      'Antworte kurz, konkret, auf Deutsch. Du kennst nur die Daten unten, keinen sonstigen Verlauf.',
      ''
    ];
    if (d) {
      lines.push('Modell: ' + d.model);
      lines.push('Maschine: ' + d.machine);
      var g = d.geometry;
      lines.push('Geometrie: ' + g.widthMm + 'x' + g.depthMm + 'x' + g.heightMm + ' mm, ' + g.volumeCm3 + ' cm3, ' + g.triangles + ' Dreiecke.');
      lines.push('Ueberhang: ' + (g.hasOverhang ? ('ja, bis ' + g.worstOverhangDeg + ' Grad (' + g.overhangTriangles + ' Dreiecke)') : 'nein'));
      if (g.layerCount != null) {
        lines.push('Schichten: ' + g.layerCount + ' bei ' + g.layerHeightMm + ' mm Schichthoehe.');
      }
      if (d.lastAction) {
        lines.push('Letzter Vorgang: ' + d.lastAction.what + ' (ausgeloest durch: ' + d.lastAction.trigger + ')');
      }
      lines.push('Gesetzte Werte:');
      (d.changes || []).forEach(function (c) {
        lines.push('  ' + c.key + ' = ' + c.value + (c.why ? '  // ' + c.why : ''));
      });
      if (d.slice) {
        lines.push('Slice-Werte aus ' + d.slice.source + ': Dauer ' + d.slice.duration +
          ', Filament ' + d.slice.filamentGram + ' g / ' + d.slice.filamentMeter + ' m' +
          (d.slice.costEuro != null ? ', Materialkosten ' + d.slice.costEuro + ' Euro' : '') +
          ', ' + d.slice.layers + ' Schichten.');
      } else {
        lines.push('Keine Slice-Werte vorhanden (Druckdauer/Filament gibt es erst nach dem Slicen; nicht schaetzen, sondern sagen dass sie fehlen).');
      }
      if (d.profileWritten) lines.push('Geschriebenes Profil: ' + d.profileWritten);
    } else {
      lines.push('Noch keine Modell-Analyse vorhanden.');
    }
    return lines.join('\n');
  }

  // Wird lokal von der Installation gesetzt (dashboard-config.js). Leer =
  // kein eigenes Claude-Fenster hinterlegt, dann gibt es nur die Anzeige.
  function chatUrl() {
    return (window.BRIDGE_CONFIG && window.BRIDGE_CONFIG.chatUrl) || '';
  }

  // Im eigenen Programm beantwortet die lokale Claude-Code-Installation die
  // Fragen - kein Login, kein Schluessel. Das Programm meldet das ueber
  // window.BRIDGE_HOST.
  function hostChat() {
    return !!(window.BRIDGE_HOST && window.BRIDGE_HOST.chat && window.chrome && window.chrome.webview);
  }

  function updateChatAvailability() {
    if (hostChat()) {
      els.chatCard.hidden = false;
      els.localChatNote.hidden = true;
      els.sendBtn.disabled = state.sending;
      els.chatInput.disabled = false;
      els.chatInput.placeholder = 'Frag etwas zum aktuellen Modell oder Profil…';
      els.chatHint.textContent = 'Antworten kommen von Claude Code auf diesem Rechner.';
      return;
    }

    var ok = !!state.sampleApi;
    if (ok) {
      els.chatCard.hidden = false;
      els.sendBtn.disabled = state.sending;
      els.chatInput.disabled = false;
      els.chatHint.textContent = 'Antworten laufen ueber dein eigenes Claude-Konto.';
      return;
    }

    // Ohne Claude-Kontext waere die Chat-Box nur Attrappe. Statt einer toten
    // Eingabezeile blendet die Anzeige sie ganz aus - der Chat sitzt dann im
    // eigenen Reiter des Fensters (bzw. hinter dem Link darunter).
    els.chatCard.hidden = true;
    var url = chatUrl();
    els.localChatNote.innerHTML = '';
    if (url) {
      var a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'Chat oeffnen';
      a.className = 'chat-link';
      els.localChatNote.appendChild(document.createTextNode('Fragen zum Teil? '));
      els.localChatNote.appendChild(a);
    } else {
      els.localChatNote.textContent = 'Kein Chat eingerichtet — siehe README (Abschnitt Chat).';
    }
    els.localChatNote.hidden = false;
  }

  // Weg 1: im eigenen Programm - die Frage geht an Claude Code auf dem Rechner.
  function sendViaHost(text) {
    state.sending = true;
    els.chatInput.value = '';
    els.sendBtn.disabled = true;
    state.turns.push({ role: 'user', content: text });
    state.turns.push({ role: 'assistant', content: '' });
    renderChatLog();

    var placeholderIndex = state.turns.length - 1;
    var d = state.data;
    var kontext = buildInstructionsTurn();

    var fertig = false;
    function abschluss(inhalt, istFehler) {
      if (fertig) return;
      fertig = true;
      window.chrome.webview.removeEventListener('message', onAntwort);
      state.turns[placeholderIndex].content = inhalt;
      if (istFehler) { state.turns[placeholderIndex].error = true; }
      state.sending = false;
      els.sendBtn.disabled = false;
      renderChatLog();
    }

    function onAntwort(e) {
      var raw = typeof e.data === 'string' ? e.data : '';
      if (raw.indexOf('antwort:') !== 0) return;
      abschluss(raw.substring('antwort:'.length), false);
    }
    window.chrome.webview.addEventListener('message', onAntwort);

    // Lieber eine ehrliche Fehlermeldung als endlos "Denkt nach...".
    setTimeout(function () {
      abschluss('Keine Antwort von Claude Code (nach 3 Minuten abgebrochen). ' +
                'Laeuft es? Test: "claude -p hallo" in einer Eingabeaufforderung.', true);
    }, 185000);

    try {
      window.chrome.webview.postMessage('frage:' + kontext + '\n\nFrage: ' + text);
    } catch (err) {
      abschluss('Konnte die Frage nicht uebergeben: ' + err.message, true);
    }
  }

  async function sendMessage() {
    var text = els.chatInput.value.trim();
    if (!text || state.sending) return;
    if (hostChat()) { sendViaHost(text); return; }
    if (!state.sampleApi) return;
    state.sending = true;
    els.chatInput.value = '';
    els.sendBtn.disabled = true;
    state.turns.push({ role: 'user', content: text });
    state.turns.push({ role: 'assistant', content: '' });
    renderChatLog();

    var placeholderIndex = state.turns.length - 1;
    var ctl = new AbortController();

    try {
      var result = await state.sampleApi(
        [{ role: 'user', content: buildInstructionsTurn() }].concat(state.turns.slice(0, -1)),
        {
          cache: false,
          signal: ctl.signal,
          modelTier: 'quick',
          onText: function (u) {
            state.turns[placeholderIndex].content = u.text;
            renderChatLog();
          }
        }
      );
      state.turns[placeholderIndex].content = result.text;
    } catch (e) {
      state.turns[placeholderIndex].content = (e && e.text) ? e.text : copyForError(e && e.code);
      state.turns[placeholderIndex].error = true;
    } finally {
      state.sending = false;
      els.sendBtn.disabled = !state.sampleApi;
      renderChatLog();
    }
  }

  els.sendBtn.addEventListener('click', sendMessage);
  els.chatInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  renderModel();
  updateChatAvailability();

  // Lokaler Modus: die Bridge legt dashboard-data.js neben diese Datei; dann
  // braucht die Anzeige weder Datenbank noch Claude-Kontext.
  function bootLocal() {
    state.data = window.BRIDGE_DATA || null;
    renderModel();
    if (state.data) {
      setLive(true, 'lokal');
    } else {
      setLive(false, 'keine Daten');
    }
    setFooter('liest dashboard-data.js');
    seedGreeting();

    // Im lokalen Modus gibt es keinen Chatverlauf, der verloren gehen koennte -
    // deshalb reicht ein schlichtes Neuladen, um neue Bridge-Daten zu sehen.
    if (window.location.protocol === 'file:') {
      setInterval(function () { window.location.reload(); }, 30000);
    }
  }

  async function boot() {
    if (!window.claude || !window.claude.use) {
      bootLocal();
      return;
    }
    var db = await window.claude.use('db');
    if (db) {
      setLive(true, 'live');
      setFooter('liest bridge/latest');
      db.doc('bridge/latest').onSnapshot(function (snap) {
        state.data = snap.exists ? snap.data() : null;
        renderModel();
        seedGreeting();
      }, function () {
        setLive(false, 'db-Fehler');
        seedGreeting();
      });
    } else {
      bootLocal();
    }

    state.sampleApi = await window.claude.use('sample');
    updateChatAvailability();
  }

  boot();
})();
</script>
